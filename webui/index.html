<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>M15 IPTV Receiver</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- hls.js from the CDN with a pinned version (Section 3.8, HLR-21); used through the global Hls. -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.4/dist/hls.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <video id="video"></video>
  <div id="info-bar" class="osd hidden"></div>
  <div id="position" class="osd hidden"></div>
  <div id="zap-banner" class="osd hidden"></div>
  <div id="number-entry" class="osd hidden"></div>
  <div id="service-list" class="osd hidden"></div>
  <div id="epg-grid" class="osd hidden"></div>
  <div id="key-dialog" class="osd hidden"></div>
  <div id="volume" class="osd hidden"></div>
  <div id="status" class="osd hidden"></div>
  <div id="toast" class="osd hidden"></div>
</body>
</html>
